:root{color-scheme:dark;--bg:#0b0d10;--pn:#1a1f26;--ln:#3d4651;--tx:#f1f4f8;--dm:#a4afbc;--gd:#c6d2e0;--gn:#6fe3a1;--ls:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 iqn,"IBM Plex Sans Arabic",system-ui,Arial,sans-serif;font-variant-numeric:tabular-nums}
#main{max-width:1280px;margin:auto;padding:14px}
h1{font-size:20px;margin:0 0 10px;background:linear-gradient(90deg,#fff,#9fb0c4,#e8eef5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:0 0 8px;color:var(--gd)}
.card{background:linear-gradient(150deg,#2a3039,var(--pn) 50%,#12161b);box-shadow:inset 0 1px 0 #4a5461;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:2px;color:var(--dm);font-size:12px}
input,select,button{font:inherit;color:var(--tx);background:#0a0c0f;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gd)}
button{cursor:pointer}button.on{background:linear-gradient(180deg,#f4f7fa,#9aa7b6);color:#12161b;border-color:#dfe6ee;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--ln);text-align:start;white-space:nowrap}
th{color:var(--dm);font-weight:600;font-size:12px}
.num{text-align:end;direction:ltr}.g{color:var(--gn)}.r{color:var(--ls)}.d{color:var(--dm)}.y{color:var(--gd)}
.key{border:2px solid var(--gd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.wrap{overflow-x:auto}
tr.today td{background:#2b333d}
td input{width:100%}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}.cmp td,.cmp th{padding:2px 8px;font-size:12px}.cmp th.num{text-align:end}.cmp .gs{border-inline-start:8px solid var(--pn)}.cmp td.gs,.cmp th.gs{box-shadow:inset 2px 0 0 var(--gd)}[dir=rtl] .cmp td.gs,[dir=rtl] .cmp th.gs{box-shadow:inset -2px 0 0 var(--gd)}.rt{display:flex;flex-direction:column}
</style>

  if(S.tab==="hol"){
    h=`<div class="card wrap"><div class="d">${T("hnote")}</div><table><tr><th>${T("hn")}</th><th>${T("hd")}</th><th>${T("hs")}</th><th></th></tr>`+
    S.hol.map((x,i)=>`<tr><td><input data-h="n" data-i="${i}" value="${x.n}"></td><td><input data-h="d" data-i="${i}" type="date" value="${x.d}"></td><td><select data-h="s" data-i="${i}"><option value="f" ${x.s==="f"?"selected":""}>${T("full")}</option><option value="e" ${x.s==="e"?"selected":""}>${T("early")}</option></select></td><td><button data-x="${i}">${T("del")}</button></td></tr>`).join("")+`</table><p><button id="addH">${T("add")}</button></p></div>`;
  }
  o.innerHTML=h;
  if(S.lang==="ar"){const w=document.createTreeWalker($("#main"),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=n.nodeValue.replace(/(\d)\.(\d)/g,"$1٫$2").replace(/(\d),(?=\d)/g,"$1٬").replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d])}
}
// ---- events
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.type==="number"?(parseFloat(t.value)||0):t.value;save();render()}
  else if(t.dataset.u){S.u[t.dataset.u]=t.value;save();render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.i!==undefined&&!t.dataset.h){const i=+t.dataset.i,v=t.value.trim();if(v==="")S.days.length=i;else S.days[i]=parseFloat(v)/100;save();render()}
  else if(t.dataset.h){S.hol[+t.dataset.i][t.dataset.h]=t.value;if(t.dataset.h==="d"){S.hol.sort((a,b)=>a.d<b.d?-1:1)}save();render()}
});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.t){S.tab=t.dataset.t;save();buildInputs();render()}
  else if(t.dataset.x!==undefined){S.hol.splice(+t.dataset.x,1);save();render()}
  else if(t.id==="addH"){S.hol.push({n:"",d:key(new Date()),s:"f"});S.hol.sort((a,b)=>a.d<b.d?-1:1);save();render()}
  else if(t.id==="bAr"||t.id==="bEn"){S.lang=t.id==="bAr"?"ar":"en";save();buildInputs();render()}
  else if(t.id==="bPng"||t.id==="bPdf")exp(t.id==="bPdf");
});
function say(m){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;bottom:16px;inset-inline-start:16px;background:#1a1f26;border:1px solid #3d4651;padding:8px 12px;border-radius:8px;z-index:9";document.body.appendChild(e)}e.textContent=m;clearTimeout(e.t);e.t=setTimeout(()=>e.remove(),7000)}
async function exp(pdf){
  try{
    if(!window.html2canvas||(pdf&&!window.jspdf)){say(S.lang==="ar"?"مكتبة التصدير لم تتحمّل — تحقق من الإنترنت":"Export library not loaded — check your connection");return}
    say(S.lang==="ar"?"جارٍ التصدير…":"Exporting…");
    const dl=(window.claude&&await claude.use("downloads"))||{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
    const cv=await html2canvas($("#main"),{backgroundColor:"#0b0d10",scale:1.5,useCORS:true,logging:false,onclone:d=>{const t=d.querySelector("h1");if(t){t.style.background="none";t.style.color="#fff";t.style.webkitTextFillColor="#fff"}}});
    if(!pdf){const b=await new Promise(r=>cv.toBlob(r,"image/png"));await dl.save({filename:"iqn.png",data:b});say("✓");return}
    const P=new jspdf.jsPDF({orientation:cv.width>cv.height?"l":"p",unit:"px",format:[cv.width,cv.height]});
    P.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,cv.width,cv.height);
    await dl.save({filename:"iqn.pdf",data:P.output("blob")});say("✓");
  }catch(err){say("✗ "+((err&&(err.code||err.message))||err));console.error(err)}
}
buildInputs();render();
</script>
</body>
</html>
