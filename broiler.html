:root{color-scheme:dark;--bg:#0b0d10;--pn:#1a1f26;--ln:#3d4651;--tx:#f1f4f8;--dm:#a4afbc;--gd:#c6d2e0;--gn:#6fe3a1;--ls:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 AbdoLine,system-ui,Arial,sans-serif;font-variant-numeric:tabular-nums}
#main{max-width:1280px;margin:auto;padding:14px}
h1{font-size:22px;margin:0 0 10px;background:linear-gradient(90deg,#fff,#9fb0c4,#e8eef5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:16px;margin:0 0 8px;color:var(--gd)}
.card{background:linear-gradient(150deg,#2a3039,var(--pn) 50%,#12161b);box-shadow:inset 0 1px 0 #4a5461;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:2px;color:var(--dm);font-size:12px}
input,select,button{font:inherit;color:var(--tx);background:#0a0c0f;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--gd)}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--ln);text-align:start;white-space:nowrap}
th{color:var(--dm);font-weight:600;font-size:12px}
.num{text-align:end}.g{color:var(--gn)}.r{color:var(--ls)}.d{color:var(--dm)}.y{color:var(--gd)}
.key{border:2px solid var(--gd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
.wrap{overflow-x:auto}
td input{width:100%;min-width:56px}
.dt{position:relative;display:inline-block;min-width:76px;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;background:#0a0c0f}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0}
</style>
</head>
<body>
<div id="main">
<div class="bar"><h1 id="ttl"></h1><span style="flex:1"></span><button id="bNew" class="nox">دورة جديدة</button><button id="bPng" class="nox">PNG</button><button id="bPdf" class="nox">PDF</button></div>
<div class="card"><h2>الإعدادات</h2><div class="grid" id="set"></div></div>
<div id="out"></div>
</div>
<script>
const AR="٠١٢٣٤٥٦٧٨٩",MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const fa=s=>String(s).replace(/[0-9]/g,d=>AR[d]).replace(/\./g,"٫").replace(/,/g,"٬");
const un=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/٫/g,".").replace(/٬/g,"");
const ev=s=>{s=un(s==null?"":s).trim();if(!s||!/^[\d+\-*/.() ]+$/.test(s))return 0;try{const v=Function("return("+s+")")();return isFinite(v)?v:0}catch(e){return 0}};
const cnt=c=>(c===""||c==null)?1:ev(c);
const fmt=n=>fa((+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const m=n=>fmt(n)+" جـ",kg=n=>fmt(n)+" ك",cls=n=>n<0?"r":n>0?"g":"";
const tk=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dtx=s=>{const p=(s||tk()).split("-");return fa(+p[2])+" "+MON[+p[1]-1]};
const dtc=(at,iso)=>`<span class="dt">${dtx(iso)}<input type="date" ${at} value="${iso||tk()}" onclick="try{this.showPicker()}catch(e){}"></span>`;
const DEF=()=>({date:"2026-05-25",live:"30",price:"55",w:"2",ton:"22400",sack:"25",start:"20",step:"5",ed:"؟؟؟؟؟",
cap:[["دواجن","2026-05-25","18","31"],["توكتوك","2026-05-25","120","1"],["علف بادي","2026-05-26","585/25","25"],["علف نامي","2026-05-31","23","25"],["علف نامي","2026-06-11","22.8","25"],["دواء",tk(),"160","1"]].map(a=>({n:a[0],d:a[1],p:a[2],c:a[3]})),
cyc:[["عربون علف","2026-05-26","500"],["طوب","2026-05-26","2.5"],["تروسيكل","2026-05-26","100"],["تحصينات","2026-05-26","40"],["4 لمبات + 3 دوايا","2026-05-26","250"],["ترموميتر","2026-05-26","40"],["مواصلات","2026-05-26","20"],["مواصلات","2026-05-31","60"]].map(a=>({n:a[0],d:a[1],p:a[2],c:""})),
prev:[{n:"دواجن",d:"2026-05-08",p:"90",w:"32.4",c:"15",cost:"2403"}]});
const KEY="broiler_v1";let S=DEF();
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const I=(a,i,f,v,ph="")=>`<input data-a="${a}" data-i="${i}" data-f="${f}" value="${v}" placeholder="${ph}">`;
const D=(a,i,v)=>dtc(`data-a="${a}" data-i="${i}" data-f="d"`,v);
const X=(a,i)=>`<td><button class="nox" data-del="${a}" data-i="${i}">✕</button></td>`;
const ADD=a=>`<p><button class="nox" data-add="${a}">+ إضافة صف</button></p>`;
const row=(l,v,c="")=>`<tr><td>${l}</td><td class="num ${c}">${v}</td></tr>`;
function title(){const p=S.date.split("-");$("#ttl").textContent="فراخ التسمين — "+fa(+p[2])+" - "+MON[+p[1]-1]+" - "+fa(p[0])}
function buildSet(){
  const F=[["live","عدد الفراخ الحية"],["price","سعر اليوم (جـ/ك)"],["w","متوسط الوزن المتوقع (ك)"],["ton","سعر طن العلف"],["sack","وزن الشيكارة (ك)"],["start","بداية السيناريوهات (عدد)"],["step","زيادة السيناريوهات"]];
  $("#set").innerHTML=`<label>تاريخ الدورة${dtc('data-s="date"',S.date)}</label>`+F.map(([k,t])=>`<label>${t}<input data-s="${k}" inputmode="decimal" value="${fa(S[k])}"></label>`).join("");title()}
function exT(a,t){let sum=0;const b=S[a].map((r,i)=>{const T=ev(r.p)*cnt(r.c);sum+=T;return `<tr><td>${fa(i+1)}</td><td>${I(a,i,"n",r.n)}</td><td>${D(a,i,r.d)}</td><td>${I(a,i,"p",fa(r.p))}</td><td>${I(a,i,"c",fa(r.c),"١")}</td><td class="num">${m(T)}</td>${X(a,i)}</tr>`}).join("");
  return{sum,html:`<div class="card wrap"><h2>${t}</h2><table><tr><th>م</th><th>بيان</th><th>التاريخ</th><th>سعر الوحدة</th><th>عدد</th><th>إجمالي</th><th></th></tr>${b}<tr><th colspan="5">مجموع</th><th class="num y">${m(sum)}</th><th></th></tr></table>${ADD(a)}</div>`}}
function render(){
  const A=exT("cap","مصاريف أساسية (رأس المال)"),B=exT("cyc","مصاريف أثناء الدورة");
  const cost=A.sum+B.sum,live=ev(S.live),price=ev(S.price),w=ev(S.w),exp=live*w*price,profit=exp-cost;
  const sc=[0,1,2,3].map(i=>{const n=ev(S.start)+ev(S.step)*i,T=n*w*price;return `<tr><td>${fa(n)}</td><td class="num">${kg(w)}</td><td class="num">${m(price)}</td><td class="num">${m(cost)}</td><td class="num y">${m(T)}</td><td class="num ${cls(T-cost)}">${m(T-cost)}</td></tr>`}).join("");
  const pv=S.prev.map((r,i)=>{const T=ev(r.p)*ev(r.w),P=T-ev(r.cost);return `<tr><td>${fa(i+1)}</td><td>${I("prev",i,"n",r.n)}</td><td>${D("prev",i,r.d)}</td><td>${I("prev",i,"p",fa(r.p))}</td><td>${I("prev",i,"w",fa(r.w))}</td><td>${I("prev",i,"c",fa(r.c))}</td><td>${I("prev",i,"cost",fa(r.cost))}</td><td class="num y">${m(T)}</td><td class="num ${cls(P)}">${m(P)}</td>${X("prev",i)}</tr>`}).join("");
  const kgp=ev(S.ton)/1000;
  $("#out").innerHTML=`<div class="cols">${A.html}${B.html}</div>
<div class="cols"><div class="card"><h2>التكلفة</h2><table>${row("مصاريف أساسية",m(A.sum))+row("مصاريف أثناء الدورة",m(B.sum))+row("التكلفة",m(cost),"y")}</table></div>
<div class="card key"><h2>الأرباح</h2><table>${row("البيع المتوقع",m(exp))+row("التكلفة",m(cost))+row("الربح",m(profit),cls(profit))}</table></div>
<div class="card"><h2>العلف</h2><table>${row("سعر الطن",m(ev(S.ton)))+row("سعر الكيلو",m(kgp))+row("سعر الشيكارة ("+fa(S.sack)+" ك)",m(kgp*ev(S.sack)),"y")}</table></div></div>
<div class="card wrap"><h2>البيع المتوقع</h2><table><tr><th>بيان</th><th>التاريخ</th><th>سعر الكيلو</th><th>متوسط الوزن</th><th>عدد</th><th>إجمالي</th></tr><tr><td>دواجن</td><td><input data-e="1" value="${S.ed}"></td><td class="num">${m(price)}</td><td class="num">${kg(w)}</td><td class="num">${fa(live)}</td><td class="num y">${m(exp)}</td></tr></table></div>
<div class="card wrap"><h2>سيناريوهات البيع</h2><table><tr><th>عدد</th><th>متوسط الوزن</th><th>سعر الكيلو</th><th>التكلفة</th><th>إجمالي</th><th>الربح</th></tr>${sc}</table></div>
<div class="card wrap"><h2>البيع السابق</h2><table><tr><th>م</th><th>بيان</th><th>التاريخ</th><th>سعر الكيلو</th><th>الوزن الكلي (ك)</th><th>عدد</th><th>التكلفة</th><th>إجمالي</th><th>الأرباح</th><th></th></tr>${pv}</table>${ADD("prev")}</div>`}
function later(){setTimeout(()=>{const a=document.activeElement,d=a&&a.dataset,sel=d&&d.a!==undefined?`[data-a="${d.a}"][data-i="${d.i}"][data-f="${d.f}"]`:null;render();if(sel){const el=$(sel);el&&el.focus()}},0)}
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.a){S[d.a][+d.i][d.f]=(d.f==="n"||d.f==="d")?t.value:un(t.value);save();later()}
  else if(d.s){S[d.s]=d.s==="date"?(t.value||S.date):un(t.value);save();title();later()}
  else if(d.e){S.ed=t.value;save()}});
document.addEventListener("click",e=>{const t=e.target,d=t.dataset;
  if(d.del){S[d.del].splice(+d.i,1);save();render()}
  else if(d.add){S[d.add].push(d.add==="prev"?{n:"دواجن",d:tk(),p:"",w:"",c:"",cost:""}:{n:"",d:tk(),p:"",c:""});save();render()}
  else if(t.id==="bNew")newCycle();
  else if(t.id==="bPng"||t.id==="bPdf")exp(t.id==="bPdf")});
function say(s){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;bottom:16px;inset-inline-start:16px;background:#1a1f26;border:1px solid #3d4651;padding:8px 12px;border-radius:8px;z-index:9";document.body.appendChild(e)}e.textContent=s;clearTimeout(e.t);e.t=setTimeout(()=>e.remove(),7000)}
async function exp(pdf,name){
  try{
    if(!window.html2canvas||(pdf&&!window.jspdf)){say("مكتبة التصدير لم تتحمّل — تحقق من الإنترنت");return false}
    say("جارٍ التصدير…");
    const dl=(window.claude&&await claude.use("downloads"))||{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
    const base=name||("broiler-"+S.date);
    const cv=await html2canvas($("#main"),{backgroundColor:"#0b0d10",scale:1.5,useCORS:true,logging:false,onclone:d=>{d.querySelectorAll(".nox").forEach(x=>x.style.display="none");const t=d.querySelector("h1");if(t){t.style.background="none";t.style.color="#fff";t.style.webkitTextFillColor="#fff"}}});
    if(!pdf){const b=await new Promise(r=>cv.toBlob(r,"image/png"));await dl.save({filename:base+".png",data:b});say("✓");return true}
    const P=new jspdf.jsPDF({orientation:cv.width>cv.height?"l":"p",unit:"px",format:[cv.width,cv.height]});
    P.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,cv.width,cv.height);
    await dl.save({filename:base+".pdf",data:P.output("blob")});say("✓");return true;
  }catch(err){say("✗ "+((err&&(err.code||err.message))||err));console.error(err);return false}}
async function newCycle(){
  if(!confirm("سيتم حفظ الدورة الحالية كملف PDF ثم مسح المصاريف والمبيعات وعدد الفراخ وتاريخ الدورة. متأكد؟"))return;
  if(!await exp(true,"broiler-"+S.date))return;
  S.cap=[];S.cyc=[];S.prev=[];S.live="0";S.date=tk();S.ed="؟؟؟؟؟";save();buildSet();render()}
buildSet();render();
</script>
</body>
</html>
